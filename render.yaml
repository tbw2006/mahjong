# Render Blueprint：推送到 GitHub 后，在 Render 选 “New + Blueprint” 即可一键部署
services:
  - type: web
    name: jingzhi-mahjong
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8000
