<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d5c3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>雅趣麻将 · 全平台联机（联网预留架构已落地）</title>
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🀄</span>雅趣麻将<span class="brand-sub">精致真实风 · 多玩法 · 癞子 · 番倍计分 · 联网预留</span></div>
      <div class="topbar-right">
        <span id="rule-chip" class="rule-chip">未开局</span>
        <select id="speed-select" class="select-box speed-select" title="机器人出牌速度">
          <option value="slow">🐢 慢速</option>
          <option value="normal">🚶 正常</option>
          <option value="fast">⚡ 快速</option>
        </select>
        <button id="btn-home" class="btn ghost" title="返回主菜单，切换单机/联机">⌂ 主菜单</button>
        <button id="btn-sound" class="icon-btn" title="音效开关">🔊</button>
        <button id="btn-help" class="btn ghost">玩法说明</button>
        <button id="btn-settings" class="btn">规则设置</button>
      </div>
    </header>

    <div class="table-wrap">
      <div class="table">
        <div class="felt">
          <div id="opp-top" class="opp opp-top"></div>
          <div id="opp-left" class="opp opp-left"></div>
          <div id="opp-right" class="opp opp-right"></div>

          <div id="river-top" class="river river-top"></div>
          <div id="river-left" class="river river-left"></div>
          <div id="river-right" class="river river-right"></div>
          <div id="river-bottom" class="river river-bottom"></div>

          <div id="center-plaque" class="plaque"></div>

          <div id="scoreboard" class="scoreboard"></div>

          <div class="my-area">
            <div id="my-melds"></div>
            <div id="actions"></div>
            <div id="hand"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="action-flash" aria-hidden="true">
      <div class="flash-burst"></div>
      <div class="flash-body"><span class="flash-kind">牌</span><span class="flash-text"></span></div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <div class="rotate-hint" id="rotate-hint">
    <div>
      <span class="phone-icon">📱</span>
      请横屏游玩<br/>旋转手机以继续
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
